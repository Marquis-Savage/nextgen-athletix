<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NextGen Athlete DB - Football Scouting Platform</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js for interactive client state -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen" x-data="appData()">

  <!-- Top Navigation & Persona View Switcher -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" @click="currentView = 'search'">
        <div class="bg-indigo-600 p-2 rounded-lg text-white font-black tracking-widest text-lg">
          NXG
        </div>
        <div>
          <span class="font-bold text-lg tracking-wide bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">
            NEXTGEN ATHLETIX
          </span>
          <span class="ml-2 text-[10px] font-bold px-2 py-0.5 rounded bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 uppercase tracking-wider">
            FOOTBALL HQ
          </span>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex items-center space-x-1 sm:space-x-2">
        <button 
          @click="currentView = 'search'" 
          :class="currentView === 'search' ? 'bg-indigo-600/20 text-indigo-400 border-indigo-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'"
          class="px-3 py-1.5 rounded-md text-xs font-semibold border border-transparent transition flex items-center space-x-1.5">
          <i data-lucide="search" class="w-4 h-4"></i>
          <span>Scout Engine</span>
        </button>

        <button 
          @click="currentView = 'profile'" 
          :class="currentView === 'profile' ? 'bg-indigo-600/20 text-indigo-400 border-indigo-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'"
          class="px-3 py-1.5 rounded-md text-xs font-semibold border border-transparent transition flex items-center space-x-1.5">
          <i data-lucide="user" class="w-4 h-4"></i>
          <span>Athlete Profile</span>
        </button>

        <button 
          @click="currentView = 'personnel_creator'" 
          :class="currentView === 'personnel_creator' ? 'bg-indigo-600/20 text-indigo-400 border-indigo-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'"
          class="px-3 py-1.5 rounded-md text-xs font-semibold border border-transparent transition flex items-center space-x-1.5">
          <i data-lucide="plus-circle" class="w-4 h-4 text-emerald-400"></i>
          <span>Add Athlete / Grade</span>
        </button>

        <button 
          @click="currentView = 'admin'" 
          :class="currentView === 'admin' ? 'bg-indigo-600/20 text-indigo-400 border-indigo-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'"
          class="px-3 py-1.5 rounded-md text-xs font-semibold border border-transparent transition flex items-center space-x-1.5">
          <i data-lucide="shield-check" class="w-4 h-4 text-amber-400"></i>
          <span>Admin Portal</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <!-- VIEW 1: ADVANCED SCOUT & SEARCH ENGINE -->
    <div x-show="currentView === 'search'" x-cloak>
      <div class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <h1 class="text-2xl font-extrabold text-white">Scout Search & Athlete Database</h1>
          <p class="text-xs text-slate-400 mt-1">Search verified prospects across states, positions, combine scores, and multi-evaluator grade averages.</p>
